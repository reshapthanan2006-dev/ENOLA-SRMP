@if (missingSkills.length > 0) {

  <div class="skills-result">

    <span class="result-label">
      Missing skills
    </span>

    <div class="skill-list">

      @for (skill of missingSkills; track skill) {

        <button
          type="button"
          class="skill-button"
          (click)="selectSkill(skill)">
          {{ skill }}
        </button>

      }

    </div>

    <p class="skill-help">
      Select a skill to add it to your profile.
    </p>

  </div>

} @else {

  <div class="skills-result complete-result">

    <span
      class="result-check"
      aria-hidden="true">
      &#10003;
    </span>

    <p>
      Your profile covers every required skill.
    </p>

  </div>

}
