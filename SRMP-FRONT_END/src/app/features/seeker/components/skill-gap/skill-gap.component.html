<section class="skill-gap">
  <h3>Missing Skills</h3>

  @if (missingSkills.length > 0) {
    <p>Select a skill to add it to your profile form.</p>

    <div class="skill-list">
      @for (skill of missingSkills; track $index) {
        <button
          class="skill-button"
          type="button"
          (click)="selectSkill(skill)"
        >
          {{ skill }}
        </button>
      }
    </div>
  } @else {
    <p>Your profile covers every required skill.</p>
  }
</section>
